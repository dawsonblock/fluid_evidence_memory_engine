[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluid-evidence-memory-engine"
version = "0.7.4"
description = "Token-anchored claim memory with evidence links, lifecycle control, verification, review workflow, source governance, citation packets, retention, auditable retrieval, runtime storage adapters, migrations, ledger governance, and a runnable PostgreSQL backend."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dawson Block" }]
dependencies = ["pydantic>=2.6", "typer>=0.12", "rich>=13.7", "PyYAML>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4", "psycopg[binary]>=3.1"]
postgres = ["psycopg[binary]>=3.1"]
vector = ["pgvector>=0.2"]
tokenizers = ["tiktoken>=0.7"]

[project.scripts]
feme = "feme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
feme = ["sqlite_schema.sql", "postgres_schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
