salience_decay_per_run: 0.03
minimum_active_salience: 0.12

source_quality:
  court_record: 0.95
  official_record: 0.95
  statute: 0.95
  legal_xml: 0.95
  email: 0.75
  uploaded_pdf: 0.75
  document: 0.75
  log: 0.70
  user_statement: 0.55
  note: 0.55
  chat: 0.55
  ai_summary: 0.25
  inference: 0.25

sensitive_terms:
  - health
  - diagnosis
  - medication
  - religion
  - political
  - sexual
  - password
  - api key
  - private key
  - sin
  - social insurance
